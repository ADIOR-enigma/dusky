# ==============================================================================
# Gorogoa Profile
# ==============================================================================

extends = "base_wine_dxvk"

[meta]
id = "gorogoa"
name = "Gorogoa"
version = "1.0"
icon = "applications-games"
developer = "Jason Roberts / Annapurna Interactive"
genre = "Puzzle / Narrative"
description = "Elegant hand-illustrated puzzle story where you rearrange panels to guide a boy through fantastical scenes."

[paths]
game_dir = "/mnt/zram1/Gorogoa-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "steamclient_loader_x86.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "d3d9" = "n", "dxgi" = "n", "d3d11" = "n", "d3d12" = "n" }

[graphics]
gpu = "auto"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
