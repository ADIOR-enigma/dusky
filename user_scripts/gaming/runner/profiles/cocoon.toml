# ==============================================================================
# COCOON Profile
# ==============================================================================
# Engine: Unity (Mono) - Windows build via Wine
# Notes: Puzzle adventure by Geometric Interactive / Annapurna. Direct exe universe.exe.

extends = "base_wine_dxvk"

[meta]
id = "cocoon"
name = "COCOON"
version = "1.0"
icon = "applications-games"
developer = "Geometric Interactive"
genre = "Puzzle / Adventure"
description = "From the lead gameplay designer of LIMBO & INSIDE — an adventure across worlds within worlds. Master world-leaping mechanics to unravel a cosmic mystery."

[paths]
game_dir = "/mnt/zram1/COCOON-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "universe.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "d3d9" = "n", "dxgi" = "n", "d3d11" = "n", "d3d12" = "n" }

[graphics]
gpu = "discrete"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
