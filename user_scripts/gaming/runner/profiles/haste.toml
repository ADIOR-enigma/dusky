# ==============================================================================
# Haste Profile
# ==============================================================================
# Engine: Unity 2022+ Mono (Native Linux) with Steam Runtime wrapper.

extends = "base_unity_native"

[meta]
id = "haste"
name = "Haste"
version = "1.0"
icon = "applications-games"
developer = "Unknown"
genre = "Action / Roguelike / Platformer"
description = "High-velocity third-person action roguelike - run, vault and shatter through collapsing worlds."

[paths]
game_dir = "/mnt/zram1/Haste-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "runtime/run.sh"
working_dir = "."
arguments = ["./Haste.x86_64"]

[runtime]
type = "native"

[graphics]
gpu = "auto"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
