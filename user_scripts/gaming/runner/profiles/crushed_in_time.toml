# ==============================================================================
# Crushed In Time Profile
# ==============================================================================
# Engine: Unity IL2CPP (Windows) via ColdClientLoader.

extends = "base_wine_dxvk"

[meta]
id = "crushed_in_time"
name = "Crushed In Time"
version = "1.0"
icon = "applications-games"
developer = "Draw Me A Pixel"
genre = "Adventure / Puzzle"
description = "Time-bending Unity adventure from Draw Me A Pixel. Manipulate timelines and solve intricate puzzles across interconnected eras."

[paths]
game_dir = "/mnt/zram1/Crushed.In.Time-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "steamclient_loader_x64.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "d3d9" = "n", "dxgi" = "n", "d3d11" = "n", "d3d12" = "n" }

[graphics]
gpu = "discrete"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
