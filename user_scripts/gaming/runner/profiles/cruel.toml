# ==============================================================================
# CRUEL Profile
# ==============================================================================
# Engine: Godot (Windows) via ColdClientLoader. Steam loader dispatches Cruel.exe.
# Developer: James Dornan - retro roguelike horror FPS.

extends = "base_wine_dxvk"

[meta]
id = "cruel"
name = "CRUEL"
version = "1.0"
icon = "applications-games"
developer = "James Dornan"
genre = "FPS / Horror / Roguelike"
description = "Fast run-and-gun horror boomer shooter with roguelike elements. Race through a collapsing cult-infested hotel, using speed and soda as health and currency for upgrades."

[paths]
game_dir = "/mnt/zram1/CRUEL-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "steamclient_loader_x64.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "d3d9" = "n", "dxgi" = "n", "d3d11" = "n", "d3d12" = "n" }

[graphics]
gpu = "discrete"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
