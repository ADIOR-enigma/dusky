# ==============================================================================
# I Am Your Beast Profile
# ==============================================================================

extends = "base_wine_dxvk"

[meta]
id = "i_am_your_beast"
name = "I Am Your Beast"
version = "1.0"
icon = "applications-games"
developer = "Strange Scaffold"
genre = "FPS / Action"
description = "Revenge thriller FPS - you are a retired covert agent dragged back for one last mission against the military-industrial complex."

[paths]
game_dir = "/mnt/zram1/I.Am.Your.Beast-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "steamclient_loader_x64.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "d3d9" = "n", "dxgi" = "n", "d3d11" = "n", "d3d12" = "n" }

[graphics]
gpu = "discrete"
wayland_native = true

[performance]
gamemode = true
fps_limit = 60
