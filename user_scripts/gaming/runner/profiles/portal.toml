# ==============================================================================
# Portal Profile
# ==============================================================================

extends = "base_native"

[meta]
id = "portal"
name = "Portal"
version = "1.0"
icon = "applications-games"
developer = "Valve"
genre = "Puzzle / FPS"
description = "Set in the mysterious Aperture Science Laboratories, Portal is one of the most innovative new games on the horizon and offers gamers hours of unique gameplay."

[paths]
game_dir = "/mnt/zram1/portal/Portal.Collection-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "Portal/steam-runtime/run.sh"
working_dir = "Portal"
arguments = ["./hl2.sh", "-game", "portal", "-steam", "-novid"]

[runtime]
type = "native"

[graphics]
gpu = "auto"
wayland_native = true

[graphics.gamescope]
enabled = true
mode = "embedded"
width = 1920
height = 1080
output_width = 1920
output_height = 1080
allow_tearing = true

[performance]
gamemode = true
fps_limit = 60
