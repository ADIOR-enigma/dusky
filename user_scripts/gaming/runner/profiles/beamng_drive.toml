# ==============================================================================
# BeamNG.drive Profile — Native Linux (v0.39.4)
# ==============================================================================
# Engine: Custom BeamNG Torque-derived / Vulkan (Native Linux BinLinux binary)
# Tested: 2026-08-30 — BinLinux/BeamNG.drive.x64 ELF verified (ldd clean, headless init OK)
# Fix 2026-08-30: On pure Wayland Hyprland (DISPLAY="") native launch hits
#   "[error] [:1] No DISPLAY detected" -> GFX Null device -> hang/segfault.
#   Enabling Gamescope embedded provides nested Xwayland :0 + Wayland backend,
#   matching fix used for Unity 2017 (blasphemous.toml:17) on pure Wayland.
# Notes:
#   * Native Wayland Vulkan binary (libwayland-client.so, vulkan on wayland/x11/offscreen)
#   * CEF/EOS + SDL still probes X11 - requires Xwayland via Gamescope on pure Wayland
#   * No DwarFS — loose repack at /mnt/zram1/BeamNG.drive.v0.39.4
#   * Executable: BeamNG.drive/BinLinux/BeamNG.drive.x64 (chmod +x auto-handled)
#   * Working dir defaults to executable's parent (BinLinux) — required for bundled libs
#   * GPU: discrete (heavy soft-body physics + Vulkan renderer benefits from dGPU prime-run)
#   * Verified headless init: "./BeamNG.drive.x64 -headless" boots to [S_API] SteamAPI_Init OK
#   * Verified Gamescope: stays alive 10s with vulkan Intel compositor + prime-run dGPU child
# ==============================================================================

extends = "base_native"

[meta]
id = "beamng_drive"
name = "BeamNG.drive"
version = "0.39.4"
icon = "/mnt/zram1/BeamNG.drive.v0.39.4/icon-beamng.ico"
developer = "BeamNG GmbH"
genre = "Driving / Simulation"
description = "Dynamic soft-body physics vehicle simulator with open-world driving, highly detailed crash deformation, and extensive modding. Native Linux Vulkan build verified via headless init and dry-run."

[paths]
game_dir = "/mnt/zram1/BeamNG.drive.v0.39.4"
executable = "BeamNG.drive/BinLinux/BeamNG.drive.x64"
arguments = []

[runtime]
type = "native"

[graphics]
gpu = "discrete"
wayland_native = true
prefer_xwayland = true
vulkan_icd = "auto"

[graphics.gamescope]
enabled = true
mode = "embedded"
width = 0
height = 0
output_width = 0
output_height = 0
refresh_rate = 0
fsr_upscaling = false
fsr_sharpness = 2
allow_tearing = true
force_grab_cursor = false
hdr = false
extra_args = []

[performance]
gamemode = true
mangohud = false
fps_limit = 0
cpu_governor = "performance"
process_priority = 0

[audio]
driver = "pipewire"
pipewire_latency = "128/48000"

[storage]
dwarfs_cache_percent = 25
dwarfs_tidy_interval = "15m"
dwarfs_tidy_max_age = "30m"
persistent_overlay = true
auto_clean_workdir = true

[sandbox]
enabled = false
isolate_home = true
bind_gpu = true
bind_sound = true
bind_wayland = true
bind_network = false

[hooks]
pre_mount = []
post_mount = []
pre_launch = []
post_launch = []
post_unmount = []

[env]
SDL_VIDEODRIVER = "wayland"
CLUTTER_BACKEND = "wayland"
GDK_BACKEND = "wayland"
QT_QPA_PLATFORM = "wayland"
