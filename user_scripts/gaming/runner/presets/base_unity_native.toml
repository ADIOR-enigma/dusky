# ==============================================================================
# Base Unity Native Linux Preset
# Optimized for Unity Engine Linux ELF binaries (e.g. Hollow Knight, Megabonk)
# ==============================================================================

extends = "base_native"

[runtime]
type = "native"

[graphics]
gpu = "auto"
wayland_native = true

[graphics.gamescope]
allow_tearing = true

[performance]
gamemode = true

[env]
UNITY_DISABLE_AUTOLOAD = "0"
SDL_DYNAMIC_API = ""
