# Dusky kernel profile: znver4 - AMD Zen4/5 tuned (znver4) + BORE + 1000Hz; peak on Zen4/5, non-portable
# Source of truth - all tunables live here. Overrides at compile-time are ephemeral.
[meta]
name = "znver4"
description = "AMD Zen4/5 tuned (znver4) + BORE + 1000Hz; peak on Zen4/5, non-portable"
suffix = "dusky-znver4"

[release]
channel = "mainline"

[scheduler]
type = "bore"

[cpu]
opt = "znver4"
default_governor = "performance"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "always"
mglru = true
zswap_default_on = false
slub_tiny = false
numa_balancing = true

[compiler]
optimize = "o3"
lto = "thin"
kcfi = false

[dusky]
enhanced = false

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"

[modules]
mode = "expanded"
