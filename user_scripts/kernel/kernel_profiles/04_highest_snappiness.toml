# Dusky kernel profile: snappiness - BORE + full preempt at 1000Hz with madvise THP; maximum UI fluidity without perf-governor heat
# Source of truth - all tunables live here. Overrides at compile-time are ephemeral.
[meta]
name = "snappiness"
description = "BORE + full preempt at 1000Hz with madvise THP; maximum UI fluidity without perf-governor heat"
suffix = "dusky-snappy"

[release]
channel = "mainline"

[scheduler]
type = "bore"

[cpu]
opt = "native"
default_governor = "schedutil"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "madvise"
mglru = true
zswap_default_on = false
slub_tiny = false
numa_balancing = true

[compiler]
optimize = "o3"
lto = "thin"
kcfi = false

[dusky]
enhanced = false

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"

[modules]
mode = "expanded"
