# Dusky kernel profile: desktop snappiness / app-switch latency.
[meta]
name = "snappiness"
description = "BORE + full preempt at 1000Hz with madvise THP; maximum UI fluidity without perf-governor heat"
suffix = "dusky-snappy"

[release]
channel = "mainline"

[scheduler]
type = "bore"

[cpu]
opt = "native"
default_governor = "schedutil"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "madvise"
mglru = true
zswap_default_on = false
slub_tiny = false

[compiler]
optimize = "o3"
lto = "thin"

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"
