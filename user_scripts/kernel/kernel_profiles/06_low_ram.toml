# Small-footprint build for <=8 GiB systems
# generated by Dusky Kernel Compiler 4.0.0

[meta]
name = "low_ram"
description = "Small-footprint build for <=8 GiB systems"
suffix = "dusky-lowram"
priority = 60
tags = []

[release]
channel = "mainline"
pin = ""
allow_rc = false
min_version = ""

[scheduler]
type = "eevdf"
autogroup = true
rt_group = false
allow_vanilla_fallback = true

[dusky]
enhanced = false
hostname = "dusky"
user = "dusky"
reproducible = true
extra_config = {}

[cpu]
arch = "native"
governor = "schedutil"
amd_pstate = "undefined"
mitigations = true
nr_cpus = 32
smt = true
mce = true

[timing]
hz = 1000
tickless = "idle"
preempt = "full"
preempt_dynamic = true
hz_periodic_rcu = false

[memory]
thp = "madvise"
mglru = true
zswap_default_on = true
zswap_compressor = "zstd"
slub_tiny = true
numa = false
numa_balancing = false
ksm = true
damon = false
page_reporting = true

[compiler]
toolchain = "llvm"
optimize = "size"
lto = "thin"
kcfi = false
autofdo = false
propeller = false
zstd_clevel = 19
module_compress = "zstd"
debug_info = "none"
jobs = 0
rust = true

[power]
wq_power_efficient = false
cpu_idle_governor = "menu"
rcu_lazy = false
energy_model = false
suspend = true

[network]
congestion = "bbr"
qdisc = "fq"
mptcp = true
nf_conntrack_procfs = false

[modules]
mode = "strict"
modprobed_db = true
lmc_keep_extra = []
manage_service = true
sig_force = false
