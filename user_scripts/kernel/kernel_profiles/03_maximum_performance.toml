# Mitigations off, O3, full LTO, lazy preempt
# generated by Dusky Kernel Compiler 4.0.0

[meta]
name = "maximum_performance"
description = "Mitigations off, O3, full LTO, lazy preempt"
suffix = "dusky-max"
priority = 30
tags = []

[release]
channel = "stable"
pin = ""
allow_rc = false
min_version = ""

[scheduler]
type = "eevdf"
autogroup = true
rt_group = false
allow_vanilla_fallback = true

[dusky]
enhanced = false
hostname = "dusky"
user = "dusky"
reproducible = true
extra_config = {}

[cpu]
arch = "native"
governor = "performance"
amd_pstate = "undefined"
mitigations = false
nr_cpus = 512
smt = true
mce = true

[timing]
hz = 500
tickless = "idle"
preempt = "lazy"
preempt_dynamic = true
hz_periodic_rcu = false

[memory]
thp = "madvise"
mglru = true
zswap_default_on = false
zswap_compressor = "zstd"
slub_tiny = false
numa = true
numa_balancing = false
ksm = true
damon = false
page_reporting = true

[compiler]
toolchain = "llvm"
optimize = "o3"
lto = "full"
kcfi = false
autofdo = false
propeller = false
zstd_clevel = 19
module_compress = "zstd"
debug_info = "none"
jobs = 0
rust = true

[power]
wq_power_efficient = false
cpu_idle_governor = "menu"
rcu_lazy = false
energy_model = false
suspend = true

[network]
congestion = "bbr"
qdisc = "fq"
mptcp = true
nf_conntrack_procfs = false

[modules]
mode = "expanded"
modprobed_db = true
lmc_keep_extra = []
manage_service = true
sig_force = false
