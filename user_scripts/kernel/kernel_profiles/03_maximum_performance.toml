# Dusky kernel profile: maximum_performance - BORE + -O3 + ThinLTO + 1000Hz + THP always; native CPU codegen, schedutil governor
# Source of truth - all tunables live here. Overrides at compile-time are ephemeral.
[meta]
name = "maximum_performance"
description = "BORE + -O3 + ThinLTO + 1000Hz + THP always; native CPU codegen, schedutil governor"
suffix = "dusky-maxperf"

[release]
channel = "mainline"

[scheduler]
type = "bore"

[cpu]
opt = "native"
default_governor = "schedutil"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "always"
mglru = true
zswap_default_on = false
slub_tiny = false
numa_balancing = true

[compiler]
optimize = "o3"
lto = "thin"
kcfi = false

[dusky]
enhanced = false

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"

[modules]
mode = "expanded"
