# Dusky kernel profile: throughput_bmq - BMQ throughput scheduler + -O3 + 1000Hz; batch workloads, expanded modules
# Source of truth - all tunables live here. Overrides at compile-time are ephemeral.
[meta]
name = "throughput_bmq"
description = "BMQ throughput scheduler + -O3 + 1000Hz; batch workloads, expanded modules"
suffix = "dusky-bmq"

[release]
channel = "stable"

[scheduler]
type = "bmq"

[cpu]
opt = "native"
default_governor = "schedutil"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "always"
mglru = true
zswap_default_on = false
slub_tiny = false
numa_balancing = true

[compiler]
optimize = "o3"
lto = "thin"
kcfi = false

[dusky]
enhanced = false

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"

[modules]
mode = "expanded"
