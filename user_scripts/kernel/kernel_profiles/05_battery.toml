# Laptop endurance: TEO idle, lazy RCU, power-efficient workqueues
# generated by Dusky Kernel Compiler 4.0.0

[meta]
name = "battery"
description = "Laptop endurance: TEO idle, lazy RCU, power-efficient workqueues"
suffix = "dusky-battery"
priority = 50
tags = []

[release]
channel = "mainline"
pin = ""
allow_rc = false
min_version = ""

[scheduler]
type = "eevdf"
autogroup = true
rt_group = false
allow_vanilla_fallback = true

[dusky]
enhanced = false
hostname = "dusky"
user = "dusky"
reproducible = true
extra_config = {}

[cpu]
arch = "native"
governor = "schedutil"
amd_pstate = "active"
mitigations = true
nr_cpus = 512
smt = true
mce = true

[timing]
hz = 250
tickless = "idle"
preempt = "voluntary"
preempt_dynamic = true
hz_periodic_rcu = false

[memory]
thp = "madvise"
mglru = true
zswap_default_on = true
zswap_compressor = "zstd"
slub_tiny = false
numa = true
numa_balancing = false
ksm = true
damon = false
page_reporting = true

[compiler]
toolchain = "llvm"
optimize = "o2"
lto = "thin"
kcfi = false
autofdo = false
propeller = false
zstd_clevel = 19
module_compress = "zstd"
debug_info = "none"
jobs = 0
rust = true

[power]
wq_power_efficient = true
cpu_idle_governor = "teo"
rcu_lazy = true
energy_model = true
suspend = true

[network]
congestion = "bbr"
qdisc = "fq"
mptcp = true
nf_conntrack_procfs = false

[modules]
mode = "strict"
modprobed_db = true
lmc_keep_extra = []
manage_service = true
sig_force = false
