# Remote Target Profile for workstation (alderlake, 8 cores)
# generated by Dusky Kernel Compiler 5.0.0

[meta]
name = "remote_workstation"
description = "Remote Target Profile for workstation (alderlake, 8 cores)"
suffix = "dusky-workstation"
priority = 50
tags = []
bare_metal_only = false
portable_package = false

[release]
channel = "mainline"
pin = ""
allow_rc = false
min_version = "7.2"

[scheduler]
type = "eevdf"
scx = "none"
scx_flags = ""
scx_enable_class = true
require_patch = false
autogroup = true
rt_group = false
allow_vanilla_fallback = true

[cache]
sched_cache = true
llc_aggr_tolerance = 1
persist = true

[rseq]
slice_extension = true
slice_ext_nsec = 10000

[dusky]
enhanced = false
hostname = "dusky"
user = "dusky"
reproducible = true
extra_config = { "CONFIG_VIRTIO" = true, "CONFIG_VIRTIO_PCI" = "m", "CONFIG_VIRTIO_PCI_LIB" = "m", "CONFIG_VIRTIO_PCI_MODERN" = true, "CONFIG_VIRTIO_BALLOON" = "m", "CONFIG_VIRTIO_BLK" = "m", "CONFIG_VIRTIO_NET" = "m", "CONFIG_VIRTIO_CONSOLE" = "m", "CONFIG_VIRTIO_INPUT" = "m", "CONFIG_DRM_VIRTIO_GPU" = "m", "CONFIG_HW_RANDOM_VIRTIO" = "m", "CONFIG_VIRTIO_FS" = "m", "CONFIG_NET_9P_VIRTIO" = "m", "CONFIG_VIRTIO_VSOCKETS" = "m", "CONFIG_VIRTIO_VSOCKETS_COMMON" = "m", "CONFIG_VIRTIO_DMA_SHARED_BUFFER" = "m", "CONFIG_FW_CFG_SYSFS" = "m" }

[cpu]
arch = "alderlake"
march = ""
governor = "schedutil"
amd_pstate = "active"
epp = "balance_performance"
mitigations = true
nr_cpus = 8
smt = true
mce = true
prefcore = true

[timing]
hz = 500
tickless = "idle"
preempt = "lazy"
preempt_dynamic = true
hz_periodic_rcu = false

[memory]
thp = "madvise"
thp_defrag = "defer+madvise"
thp_shmem = "advise"
mglru = true
mglru_mask = 7
mglru_min_ttl_ms = 0
watermark_scale_factor = 200
watermark_boost_factor = 0
compaction_proactiveness = 0
swap_backend = "zram"
zswap_compressor = "zstd"
zswap_zpool = "zsmalloc"
zram_size_pct = 100
zram_multi_comp = true
slub_tiny = false
numa = true
numa_balancing = false
nodes_shift = 1
ksm = false
damon = false
page_reporting = false

[compiler]
toolchain = "llvm"
optimize = "size"
allow_unsupported_o3 = false
lto = "thin"
thinlto_cache = true
thinlto_cache_size = "20g"
fdo = "none"
fdo_profile_dir = ""
kcfi = false
zstd_clevel = 19
module_compress = "zstd"
debug_info = "reduced"
jobs = 0
rust = false
headers = "never"

[security]
profile = "balanced"
init_on_alloc = true
hardened_usercopy = true
stackprotector = "strong"
slab_freelist_hardened = true
randomize_kstack = true
mitigations = "auto"
acknowledge_risk = false

[gaming]
ntsync = true
uclamp = true
max_map_count = 2147483642
split_lock_mitigate = false

[storage]
nvme_poll_queues = 0
io_scheduler = "none"
blk_wbt = true

[power]
wq_power_efficient = false
cpu_idle_governor = "teo"
rcu_lazy = false
energy_model = false
suspend = true

[network]
congestion = "bbr"
qdisc = "fq"
mptcp = true
nf_conntrack_procfs = false
xdp = false

[modules]
mode = "strict"
modprobed_db = true
modprobed_db_path = "/home/dusk/.config/dusky/settings/dusky_kernel_compile/imports/workstation/modprobed.db"
lmc_keep_extra = ["drivers/virtio", "drivers/net", "drivers/gpu/drm/virtio", "net/9p"]
manage_service = true
sig_force = false

[verify]
strict = true
optional_symbols = ["SCHED_BORE", "SCHED_ALT", "THINLTO_CACHE", "PER_VMA_LOCK", "SLAB_BUCKETS", "MEMORY_TIERING", "SWAP_TABLE", "CFI_ICALL_NORMALIZE_INTEGERS", "MODULE_ALLOW_BTF_MISMATCH", "TRIM_UNUSED_KSYMS", "LD_DEAD_CODE_DATA_ELIMINATION"]
assert_runtime = true
require_ntsync = true
require_btf = true
require_sched_ext = true
