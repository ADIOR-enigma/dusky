# Dusky kernel profile: generic_v4 - Distributable v4 (AVX512, 2021+) + BORE + 1000Hz; modern fleet, expanded modules
# Source of truth - all tunables live here. Overrides at compile-time are ephemeral.
[meta]
name = "generic_v4"
description = "Distributable v4 (AVX512, 2021+) + BORE + 1000Hz; modern fleet, expanded modules"
suffix = "dusky-v4"

[release]
channel = "stable"

[scheduler]
type = "bore"

[cpu]
opt = "generic_v4"
default_governor = "schedutil"

[timing]
hz = 1000
tickless = "full"
preempt = "full"

[memory]
thp = "always"
mglru = true
zswap_default_on = false
slub_tiny = false
numa_balancing = true

[compiler]
optimize = "o3"
lto = "thin"
kcfi = false

[dusky]
enhanced = false

[power]
wq_power_efficient = false

[network]
congestion = "bbr"
qdisc = "fq"

[modules]
mode = "expanded"
